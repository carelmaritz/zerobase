# Alembic settings for developers, used by the `alembic` command run from the project root.
# The app itself does not read this file: it applies migrations on start (zerobase/migrate.py).
# The database URL comes from ZEROBASE_DATABASE_URL, as for the app.

[alembic]
script_location = src/zerobase/migrations
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
