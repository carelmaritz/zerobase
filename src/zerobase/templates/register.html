{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Create your account</h1>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/register" class="stack">
    <label>Email <input type="email" name="email" autocomplete="username" required autofocus></label>
    <label>Password <input type="password" name="password" autocomplete="new-password" minlength="10" required>
      <small class="muted">At least 10 characters.</small></label>
    <button type="submit" class="primary">Create account</button>
  </form>
  <p class="muted">Already registered? <a href="/login">Sign in</a></p>
</section>
{% endblock %}
