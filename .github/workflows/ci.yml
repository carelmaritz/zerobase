name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zerobase
          POSTGRES_PASSWORD: zerobase
          POSTGRES_DB: zerobase_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zerobase -d zerobase_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - name: Tests (SQLite)
        run: pytest
      - name: Tests (PostgreSQL)
        run: pytest
        env:
          ZEROBASE_TEST_DATABASE_URL: postgresql+psycopg://zerobase:zerobase@localhost:5432/zerobase_test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config --quiet
        env:
          POSTGRES_PASSWORD: ci-only
          ZEROBASE_SECRET_KEY: ci-only-ci-only-ci-only-ci-only-ci-only
      - name: Build image
        run: docker build -t zerobase:ci .
